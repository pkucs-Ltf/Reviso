model_path: null
adapter_path: null
data_factory: null
output_dir: null
dtype: bfloat16
lora:
  rank: 4
  alpha: 8
  dropout: 0.0
trainer:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  num_train_epochs: 2
